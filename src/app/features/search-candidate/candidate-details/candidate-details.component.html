<div class="candidate-search-container">
  <!-- Search Panel -->
  <mat-card class="search-panel">
    <!-- Header -->
    <div class="search-header">
      <h1 class="search-title">Candidate Search</h1>
    </div>

    <!-- Search Form -->
    <div class="search-form">
      <div class="search-field">
        <label class="field-label">JOB TITLE</label>
        <input matInput placeholder="Eg: UI Designer" [(ngModel)]="jobTitle" (keyup.enter)="onSearch()" />
      </div>

      <!-- <mat-divider class="field-divider" vertical></mat-divider> -->
      <hr class="line">

      <div class="search-field">
        <label class="field-label">SKILLS</label>
        <input matInput placeholder="Eg: Interaction, UI design, Visual" [(ngModel)]="skills"
          (keyup.enter)="onSearch()" />
      </div>
      <hr class="line">
      <!-- <mat-divider class="field-divider" vertical></mat-divider> -->

      <div class="search-field">
        <label class="field-label">LOCATION</label>
        <input matInput placeholder="City, State, or ZIP" [(ngModel)]="location" (keyup.enter)="onSearch()" />
      </div>
      <!-- <mat-divider class="field-divider" vertical></mat-divider> -->

      <button mat-flat-button color="primary" class="search-button" (click)="onSearch()">
        Search
      </button>
    </div>
  </mat-card>

  <!-- Advanced Filters -->
  <div class="advanced-filters-section">
    <span class="filter-text">
      Use Advanced Options to filter out candidate search in more depth
    </span>
    <button mat-stroked-button class="advanced-filters-button" (click)="onAdvancedFilters()">
      <mat-icon>tune</mat-icon>
      Advanced Filters
    </button>
  </div>

  <app-advanced-search-modal *ngIf="showAdvancedFilters" [open]="showAdvancedFilters" (close)="showAdvancedFilters=false" (apply)="onAdvancedApply($event)"></app-advanced-search-modal>
  
  <div *ngIf="recentSearches.length > 0" class="recent-card">
    <div class="recent-header">Recently Searched</div>
    <div class="recent-table">
      <div class="recent-row recent-head">
        <div class="recent-col col-icon"></div>
        <div class="recent-col col-title">Title</div>
        <div class="recent-col col-location">Location</div>
        <div class="recent-col col-criteria">Search Criteria</div>
        <div class="recent-col col-age"></div>
      </div>
      <div class="recent-row" *ngFor="let item of recentSearches">
        <div class="recent-col col-icon">
          <svg viewBox="0 0 24 24" class="icon-search"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <div class="recent-col col-title">
          <a class="recent-link" (click)="repeatSearch(item)">{{ item.title }}</a>
        </div>
        <div class="recent-col col-location">{{ item.location }}</div>
        <div class="recent-col col-criteria">{{ item.criteria }}</div>
        <div class="recent-col col-age">{{ timeAgo(item.date) }}</div>
      </div>
    </div>
  </div>
</div>
