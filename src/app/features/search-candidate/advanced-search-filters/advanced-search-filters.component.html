<div class="advanced-filters-modal">
  <div class="modal-header">
    <h2>Advanced Search filters</h2>
    <button class="close-btn" (click)="onClose()">
      <svg class="close-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
      <span>Close</span>
    </button>
  </div>

  <div class="filters-grid">
    <!-- Job Experience Column -->
    <div class="filter-column">
      <h3>Job Experience</h3>
      <div class="checkbox-list">
        <label *ngFor="let option of experienceOptions" class="checkbox-item">
          <input type="checkbox" [checked]="option.checked" (change)="onCheckboxChange(option, 'experience')">
          <span>{{ option.label }}</span>
        </label>
      </div>
    </div>

    <!-- Job Type Column -->
    <div class="filter-column">
      <h3>Job Type</h3>
      <div class="checkbox-list">
        <label *ngFor="let option of typeOptions" class="checkbox-item">
          <input type="checkbox" [checked]="option.checked" (change)="onCheckboxChange(option, 'type')">
          <span>{{ option.label }}</span>
        </label>
      </div>
    </div>

    <!-- Education Column -->
    <div class="filter-column">
      <h3>Education</h3>
      <div class="checkbox-list">
        <label *ngFor="let option of educationOptions" class="checkbox-item">
          <input type="checkbox" [checked]="option.checked" (change)="onCheckboxChange(option, 'education')">
          <span>{{ option.label }}</span>
        </label>
      </div>
    </div>

    <!-- Notice Period Column -->
    <div class="filter-column">
      <h3>Notice Period</h3>
      <div class="checkbox-list">
        <label *ngFor="let option of noticeOptions" class="checkbox-item">
          <input type="checkbox" [checked]="option.checked" (change)="onCheckboxChange(option, 'notice')">
          <span>{{ option.label }}</span>
        </label>
      </div>
    </div>
  </div>

  <div class="modal-actions">
    <button class="btn-cancel" (click)="onCancel()">Cancel</button>
    <button class="btn-save" (click)="onSave()">Save</button>
  </div>
</div>
