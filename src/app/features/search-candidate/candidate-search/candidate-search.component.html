<div class="candidate-search-container">
  <form [formGroup]="searchForm">
    <!-- 🔹 Main Search Bar -->
    <div class="search-bar">
      <input type="text" placeholder="Skill / Role" formControlName="skills" />
      <div class="divider"></div>
      <input type="text" placeholder="Experience" formControlName="experience" />
      <div class="divider"></div>
      <input type="text" placeholder="Location" formControlName="location" />
      <button class="search-btn" (click)="onSearch()">Search</button>
    </div>

    <!-- 🔸 Advanced Filters -->
    <div class="advanced-filters-toggle" (click)="toggleFilters()">
      <span>Advanced Filters</span>
      <i [class.open]="showFilters" class="arrow"></i>
    </div>

    <div class="advanced-filters" *ngIf="showFilters">
      <div class="filter-row">
        <div class="filter-item">
          <label>Job Type</label>
          <select formControlName="jobType">
            <option value="">Select</option>
            <option value="fulltime">Full Time</option>
            <option value="parttime">Part Time</option>
            <option value="internship">Internship</option>
          </select>
        </div>
        <div class="filter-item">
          <label>Salary Range</label>
          <input type="text" placeholder="e.g. 5 LPA - 10 LPA" formControlName="salary" />
        </div>
        <div class="filter-item">
          <label>Qualification</label>
          <input type="text" placeholder="e.g. B.Tech, MBA" formControlName="qualification" />
        </div>
      </div>
    </div>
  </form>

  <!-- 🔹 Recently Searched -->
  <div class="recently-searched">
    <div class="header">Recently Searched</div>
    <div class="recent-list">
      <div class="recent-item" *ngFor="let item of recentSearches">
        <div class="skill">{{ item.skills }}</div>
        <div class="experience">{{ item.experience }}</div>
        <div class="location">{{ item.location }}</div>
        <div class="date">{{ item.date | date: 'dd MMM yyyy' }}</div>
      </div>
    </div>
  </div>
</div>
