<div class="candidate-results-container">
  <!-- Bulk Actions Bar -->
  <div class="bulk-actions-bar" *ngIf="selectedCandidates().length > 0" style="background: white; padding: 1rem; border-radius: var(--card-radius); box-shadow: var(--shadow-md); margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
    <span style="color: var(--default-text); font-weight: 500;">{{ selectedCandidates().length }} candidates selected</span>
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn-outline" style="color: var(--primary-blue); border-color: var(--primary-blue);">Send Message</button>
      <button class="btn-outline" style="color: var(--primary-blue); border-color: var(--primary-blue);">Download</button>
      <button class="btn-outline" style="color: #DC2626; border-color: #DC2626;">Delete</button>
    </div>
  </div>

  <!-- Data Table -->
  <div class="data-table-container" style="background: white; border-radius: var(--card-radius); box-shadow: var(--shadow-md); overflow: hidden;">
    <table style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="background: var(--secondary-gray); border-bottom: 1px solid var(--border-gray);">
          <th style="padding: 1rem; text-align: left;">
            <input type="checkbox" (change)="toggleSelectAll($event)" style="margin-right: 0.5rem;">
            <span style="color: var(--default-text); font-weight: 600; font-size: 0.875rem;">Candidate</span>
          </th>
          <th style="padding: 1rem; text-align: left;">
            <select style="border: none; background: transparent; color: var(--muted-text); font-weight: 600; font-size: 0.875rem;">
              <option>Experience</option>
            </select>
          </th>
          <th style="padding: 1rem; text-align: left;">
            <select style="border: none; background: transparent; color: var(--muted-text); font-weight: 600; font-size: 0.875rem;">
              <option>Top Skills</option>
            </select>
          </th>
          <th style="padding: 1rem; text-align: left;">
            <select style="border: none; background: transparent; color: var(--muted-text); font-weight: 600; font-size: 0.875rem;">
              <option>Actions</option>
            </select>
          </th>
          <th style="padding: 1rem; text-align: left; color: var(--muted-text); font-weight: 600; font-size: 0.875rem;">More</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let candidate of paginatedCandidates()" style="border-bottom: 1px solid var(--border-gray);">
          <td style="padding: 1rem;">
            <input type="checkbox" [checked]="selectedCandidates().includes(candidate)" (change)="toggleCandidateSelection(candidate)" style="margin-right: 1rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <img [src]="candidate.image" [alt]="candidate.name" style="width: 40px; height: 40px; border-radius: 50%;">
              <div>
                <div style="color: var(--default-text); font-weight: 500; font-size: 0.875rem;">{{ candidate.name }}</div>
                <div style="color: var(--muted-text); font-size: 0.75rem; display: flex; align-items: center; gap: 0.25rem;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                  {{ candidate.location }}
                </div>
                <div style="color: var(--muted-text); font-size: 0.75rem; display: flex; align-items: center; gap: 0.25rem;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                  {{ candidate.lastUpdated }}
                </div>
              </div>
            </div>
          </td>
          <td style="padding: 1rem; color: var(--default-text); font-size: 0.875rem;">{{ candidate.experience || '3-5 years' }}</td>
          <td style="padding: 1rem;">
            <div style="display: flex; flex-wrap: wrap; gap: 0.25rem;">
              <span *ngFor="let skill of candidate.skills.slice(0, 3)" style="background: #FEF3C7; color: #92400E; padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500;">{{ skill }}</span>
            </div>
          </td>
          <td style="padding: 1rem;">
            <select style="padding: 0.25rem 0.5rem; border-radius: 9999px; border: 1px solid; font-size: 0.75rem; font-weight: 500;" [style.background]="getStatusColor(candidate.status || 'Shortlisted')" [style.color]="getStatusTextColor(candidate.status || 'Shortlisted')" [style.border-color]="getStatusColor(candidate.status || 'Shortlisted')">
              <option>{{ candidate.status || 'Shortlisted' }}</option>
              <option>Interview Scheduled</option>
              <option>Rejected</option>
            </select>
          </td>
          <td style="padding: 1rem;">
            <button style="background: none; border: none; color: var(--primary-blue); cursor: pointer; font-size: 0.875rem;" (click)="viewCandidateDetail(candidate)">View Details</button>
            <button style="background: none; border: none; color: var(--primary-blue); cursor: pointer; font-size: 0.875rem; margin-left: 1rem;" (click)="openMessagingModal(candidate)">Message</button>
            <button style="background: none; border: none; color: var(--primary-blue); cursor: pointer; font-size: 0.875rem; margin-left: 1rem;" (click)="openInterviewSchedulingModal(candidate)">Schedule Interview</button>
            <button style="background: none; border: none; color: var(--primary-blue); cursor: pointer; font-size: 0.875rem; margin-left: 1rem;" (click)="navigateToAdvancedFilters()">Advanced Filters</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination" style="display: flex; justify-content: center; margin-top: 1rem;">
    <button *ngFor="let page of [].constructor(totalPages()); let i = index"
            [class.active]="currentPage() === i + 1"
            (click)="goToPage(i + 1)"
            style="width: 32px; height: 32px; border: 1px solid var(--border-gray); background: white; border-radius: 50%; color: var(--muted-text); cursor: pointer; font-size: 0.875rem; margin: 0 0.25rem;">
      {{ i + 1 }}
    </button>
  </div>

  <!-- Modals -->
  <app-interview-scheduling
    *ngIf="showInterviewModal()"
    (close)="closeInterviewModal()"
    (scheduled)="onInterviewScheduled($event)">
  </app-interview-scheduling>

  <app-messaging
    *ngIf="showMessagingModal()"
    (close)="closeMessagingModal()"
    (sendMessage)="onMessageSent($event)">
  </app-messaging>
</div>
