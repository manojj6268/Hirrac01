<div class="adv-modal-backdrop" *ngIf="open" (click)="onClose()"></div>
<div class="adv-modal" *ngIf="open" role="dialog" aria-modal="true" aria-label="Advanced Search">
  <div class="adv-header">
    <h3>Advanced Search Filters</h3>
    <button class="icon-btn" (click)="onClose()" aria-label="Close">×</button>
  </div>

  <form [formGroup]="form" class="adv-grid">
    <label class="field">
      <span>Experience (years)</span>
      <div class="row">
        <input type="number" formControlName="experienceMin" min="0" placeholder="Min" />
        <input type="number" formControlName="experienceMax" min="0" placeholder="Max" />
      </div>
    </label>

    <label class="field">
      <span>Salary (LPA)</span>
      <div class="row">
        <input type="number" formControlName="salaryMin" min="0" placeholder="Min" />
        <input type="number" formControlName="salaryMax" min="0" placeholder="Max" />
      </div>
    </label>

    <label class="field">
      <span>Notice Period</span>
      <select formControlName="noticePeriod">
        <option value="">Any</option>
        <option value="0-15">0–15 days</option>
        <option value="15-30">15–30 days</option>
        <option value=">30">30+ days</option>
      </select>
    </label>

    <label class="check">
      <input type="checkbox" formControlName="availableImmediately" />
      <span>Available Immediately</span>
    </label>

    <label class="field">
      <span>Current Company</span>
      <input type="text" formControlName="company" placeholder="e.g., Acme Corp" />
    </label>

    <label class="field">
      <span>Education</span>
      <input type="text" formControlName="education" placeholder="e.g., Bachelors, Masters" />
    </label>

    <label class="field full">
      <span>Skills</span>
      <input type="text" placeholder="Comma separated" (blur)="onSkillsBlur($event)" [value]="(form.get('skills')?.value || []).join(', ')" />
    </label>
  </form>

  <div class="adv-actions">
    <button class="btn" type="button" (click)="onClose()">Cancel</button>
    <button class="btn primary" type="button" (click)="onApply()">Apply Filters</button>
  </div>
</div>
