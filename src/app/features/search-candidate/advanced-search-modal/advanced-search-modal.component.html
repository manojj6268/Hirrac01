<div class="adv-modal-backdrop" *ngIf="open" (click)="onClose()"></div>
<div class="adv-modal" *ngIf="open" role="dialog" aria-modal="true" aria-label="Advanced Search">
  <div class="adv-header">
    <h2>Advanced Search filters</h2>
    <button class="close-btn" (click)="onClose()" aria-label="Close">
      <span class="close-icon">×</span>
      <span class="close-text">Close</span>
    </button>
  </div>

  <div class="adv-groups">
    <div class="group-card">
      <div class="group-title">Job Experience</div>
      <div class="group-list">
        <label><input type="checkbox" /> <span>1 year</span></label>
        <label><input type="checkbox" /> <span>2 year</span></label>
        <label><input type="checkbox" /> <span>5 year</span></label>
        <label><input type="checkbox" /> <span>10 year</span></label>
      </div>
    </div>

    <div class="group-card">
      <div class="group-title">Job Type</div>
      <div class="group-list">
        <label><input type="checkbox" /> <span>Fulltime</span></label>
        <label><input type="checkbox" /> <span>Temporary/Contract</span></label>
        <label><input type="checkbox" /> <span>Intern</span></label>
        <label><input type="checkbox" /> <span>Part Time</span></label>
        <label><input type="checkbox" /> <span>Seasonal</span></label>
      </div>
    </div>

    <div class="group-card">
      <div class="group-title">Education</div>
      <div class="group-list">
        <label><input type="checkbox" /> <span>Graduation</span></label>
        <label><input type="checkbox" /> <span>PG</span></label>
        <label><input type="checkbox" /> <span>PhD</span></label>
        <label><input type="checkbox" /> <span>Diploma</span></label>
      </div>
    </div>

    <div class="group-card">
      <div class="group-title">Notice Period</div>
      <div class="group-list">
        <label><input type="checkbox" /> <span>Immediate</span></label>
        <label><input type="checkbox" /> <span>10 Days</span></label>
        <label><input type="checkbox" /> <span>1 Month</span></label>
        <label><input type="checkbox" /> <span>3 Months</span></label>
      </div>
    </div>
  </div>

  <div class="adv-actions">
    <button class="btn cancel" type="button" (click)="onClose()">Cancel</button>
    <button class="btn primary" type="button" (click)="onApply()">Save</button>
  </div>
</div>
