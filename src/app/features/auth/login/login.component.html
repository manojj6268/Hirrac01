<div class="auth-page">
  <div class="form-card">
    <h1 class="form-title">Login</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" formControlName="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" formControlName="password" />
      </div>

      <div class="forgot-password">
        <a href="#" (click)="$event.preventDefault()">Forgot Password?</a>
      </div>

      <button type="submit" class="submit-btn">Login</button>

      <div class="auth-link">
        Don't have an account? <a routerLink="/auth/register">Register</a>
      </div>
    </form>
  </div>
</div>
