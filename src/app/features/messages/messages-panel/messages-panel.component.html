<!-- src/app/features/messages/messages-panel/messages-panel.component.html -->
<section class="messages-panel">
    <ng-container *ngIf="selectedConversation; else emptyState">
      <header class="panel-header">
        <div class="candidate-info">
          <div class="candidate-name">{{ selectedConversation.name }}</div>
          <div class="candidate-meta">
            Applied for<br>
            {{ selectedConversation.role }}<br>
            {{ selectedConversation.location }}
          </div>
        </div>
      </header>
  
      <div class="thread" #thread>
        <div class="thread-date">Tuesday, September 9</div>

        <div *ngFor="let m of messages" class="message" [ngClass]="{'message-out': m.from==='me','message-in': m.from!=='me'}">
          <div class="message-bubble">{{ m.text }}</div>
          <div class="message-time">{{ m.time }}</div>
        </div>

        <div class="thread-spacer"></div>

        <div class="composer">
          <div class="composer-input-area">
            <textarea placeholder="Write a Message" rows="1" #msgInput></textarea>
          </div>
          <div class="composer-actions">
            <div class="composer-icons">
              <button class="icon-btn" title="Attach" type="button" aria-label="Attach">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 16.2a2 2 0 0 1-2.83-2.83l8.49-8.49"/>
                </svg>
              </button>
              <button class="icon-btn" title="Message" type="button" aria-label="Message">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
              </button>
              <button class="icon-btn" title="Calendar" type="button" aria-label="Calendar">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
              </button>
            </div>
            <button class="send-btn" type="button" (click)="sendMessage(msgInput)" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22,2 15,22 11,13 2,9 22,2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </ng-container>
  
    <ng-template #emptyState>
      <div class="no-selection">Select a conversation to start messaging.</div>
    </ng-template>
  </section>
