<div class="app-root" [class.sidebar-open]="sidebarExpanded">
    <app-header *ngIf="!isAuthRoute"></app-header>
    <div class="body-container">
        <div class="sidebar-container" *ngIf="!isAuthRoute">
            <app-sidebar (expandedChange)="sidebarExpanded = $any($event)"></app-sidebar>
        </div>

        <!-- Margin-left matches sidebar width: 240 expanded, 60 collapsed -->
        <main class="router-main" [style.marginLeft.px]="sidebarExpanded && !isAuthRoute ? 240 : 60">
          <router-outlet></router-outlet>
        </main>
      </div>
</div>
