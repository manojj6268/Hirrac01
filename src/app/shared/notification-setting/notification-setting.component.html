     <aside class="sidebar">
      <div class="sidebar-inner">
        <h3 class="sidebar-title">Profile Settings</h3>
  
        <nav class="sidebar-nav">
          <button class="nav-item">
            <img src="assets/images/profile&securityIcon.png" alt="Profile & Security Icon" class="nav-icon">
            <span>Profile & Security</span>
          </button>
          <button class="nav-item" routerLink="/notification-setting" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
            <img src="assets/images/notification-settingIcon.png" alt="Notification Settings Icon" class="nav-icon">
            <span>Notification Settings</span>
          </button>
          <button class="nav-item" routerLink="/billing" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
            <img src="assets/images/sunscription&billingIcon.png" alt="Subscription & Billing Icon" class="nav-icon">
            <span>Subscription & Billing</span>
          </button>
          <button class="nav-item support-gap" routerLink="/support" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
            <img src="assets/images/support&helpIcon.png" alt="Support & Help Icon" class="nav-icon">
            <span>Support & Help</span>
          </button>
          <div class="company-section">
            <button class="nav-item" routerLink="/company-setting" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">
              <span class="title">Company Settings</span>
            </button>
          </div>
        </nav>
      </div>
    </aside>
  
    <main class="main-card">
      <div class="card">
        <!-- <div class="content-header">
          <h4>Notification Settings</h4>
        </div> -->
  
        <div class="settings-list">
          <div class="setting-item">
            <div class="setting-card">
              <div class="setting-label">Notification</div>
              <div class="setting-control">
                <button
                  class="toggle"
                  role="switch"
                  [attr.aria-checked]="notification ? 'true' : 'false'"
                  (click)="toggle('notification')"
                >
                  <span class="knob" [class.on]="notification"></span>
                </button>
              </div>
            </div>
          </div>
  
          <div class="setting-item">
            <div class="setting-card">
              <div class="setting-label">Email alerts</div>
              <div class="setting-control">
                <button
                  class="toggle"
                  role="switch"
                 
                  [attr.aria-checked]="emailAlerts ? 'true' : 'false'"
                  
                  (click)="toggle('emailAlerts')"
                >
                  <span class="knob" [class.on]="emailAlerts"></span>
                </button>
              </div>
            </div>
          </div>
  
          <div class="setting-item">
            <div class="setting-card">
              <div class="setting-label">Candidate message alerts</div>
              <div class="setting-control">
                <button
                  class="toggle"
                  role="switch"
                  [attr.aria-checked]="candidateMessageAlerts ? 'true' : 'false'"
                  (click)="toggle('candidateMessageAlerts')"
                >
                  <span class="knob" [class.on]="candidateMessageAlerts"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
  
      </div>
    </main>
  </div>
