<div class="sidebar" [class.collapsed]="isCollapsed" (transitionend)="onTransitionEnd()">
  <div class="sidebar-header"> <button class="collapse-btn" (click)="toggleCollapse()"> <mat-icon>{{isCollapsed ?
        'chevron_right' : 'chevron_left'}}</mat-icon> </button> </div>
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of menuItems" class="nav-item" tabindex="0" [attr.aria-label]="item.label"
        [attr.title]="item.label"> <a class="nav-link" [routerLink]="item.route" routerLinkActive="active"
          [routerLinkActiveOptions]="item.route === '/jobs' ? { exact: true } : { exact: false }"
          [title]="isCollapsed ? item.label : ''" (click)="closeSidebar()"> <mat-icon
            class="nav-icon">{{item.icon}}</mat-icon> <span class="nav-text"
            [class.hidden]="isCollapsed">{{item.label}}</span> </a> </li>
    </ul>
  </nav>
</div> <!-- Mobile overlay -->
<div class="sidebar-overlay" [class.show]="isOpen" (click)="closeSidebar()"></div>
