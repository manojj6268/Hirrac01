<div class="page-wrap">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-inner">
        <h3 class="sidebar-title">Profile Settings</h3>
  
        <nav class="sidebar-nav">
          <button class="nav-item active">
            <img src="assets/images/profile&securityIcon.png" alt="Profile & Security Icon" class="nav-icon">
            <span>Profile & Security</span>
          </button>
          <button class="nav-item" routerLink="/notification-setting" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
            <img src="assets/images/notification-settingIcon.png" alt="Notification Settings Icon" class="nav-icon">
            <span>Notification Settings</span>
          </button>
          <button class="nav-item" routerLink="/billing" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
            <img src="assets/images/sunscription&billingIcon.png" alt="Subscription & Billing Icon" class="nav-icon">
            <span>Subscription & Billing</span>
          </button>
          <button class="nav-item" routerLink="/support" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
            <img src="assets/images/support&helpIcon.png" alt="Support & Help Icon" class="nav-icon">
            <span>Support & Help</span>
          </button>
        </nav>
  
        <div class="company-section">
          <nav class="sidebar-nav">
            <button class="nav-item" routerLink="/company-setting" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">
              <img src="assets/images/profile&securityIcon.png" alt="Company Settings Icon" class="nav-icon">
              <span class="title">Company Settings</span>
            </button>
          </nav>
        </div>
      </div>
    </aside>
  
    <!-- Main Content -->
    <main class="main-card">
      <div class="card">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="form-grid">
          <div class="row two-cols">
            <div class="form-group">
              <label for="email" class="label">Mail ID</label>
              <input
                id="email"
                type="email"
                formControlName="email"
                placeholder="Enter your mail ID"
              />
              <div
                class="error"
                *ngIf="
                  profileForm.get('email')?.invalid &&
                  profileForm.get('email')?.touched
                "
              >
                Mail ID is required.
              </div>
            </div>
  
            <div class="form-group">
              <label for="phone" class="label">Phone Number</label>
              <input
                id="phone"
                type="tel"
                formControlName="phone"
                placeholder="9876543210"
              />
            </div>
          </div>
  
          <div class="row two-cols">
            <div class="form-group">
              <label for="firstName" class="label">First Name</label>
              <input id="firstName" type="text" formControlName="firstName" />
            </div>
  
            <div class="form-group">
              <label for="lastName" class="label">Last Name</label>
              <input id="lastName" type="text" formControlName="lastName" />
            </div>
          </div>
  
          <div class="row single-col">
            <div class="form-group">
              <label for="password" class="label">Create Password</label>
              <input
                id="password"
                type="password"
                formControlName="password"
                placeholder="********"
              />
            </div>
          </div>
  
          <div class="row actions">
            <button type="submit" class="btn primary" [disabled]="isSaving">
              {{ isSaving ? "Saving..." : "Confirm & Save" }}
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>
